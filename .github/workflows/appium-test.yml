name: 📱 Appium Mobile Automation Test

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-test:
    name: Run Appium Mobile Tests & Export Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm install
          cd testing && npm install

      - name: 🧪 Execute Appium Mobile Tests & Generate Excel Report
        run: |
          cd testing
          node generateAllExcelReports.js

      - name: 📊 Upload Appium Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-excel-report
          path: |
            testing/final-reports/appium report.xlsx
            final-reports/appium report.xlsx
          retention-days: 30
