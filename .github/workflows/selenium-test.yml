name: 🌐 Selenium Web Automation Test

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-test:
    name: Run Selenium Web Tests & Export Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 🌐 Setup Chrome Headless Browser
        uses: browser-actions/setup-chrome@v1
        ignore: true

      - name: 📦 Install Dependencies
        run: |
          npm install
          cd testing && npm install

      - name: 🧪 Execute Selenium Web Tests & Generate Excel Report
        run: |
          cd testing
          node generateAllExcelReports.js

      - name: 📊 Upload Selenium Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-excel-report
          path: |
            testing/final-reports/selenium report.xlsx
            final-reports/selenium report.xlsx
          retention-days: 30
